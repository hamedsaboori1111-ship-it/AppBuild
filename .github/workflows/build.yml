name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        echo "Extracting $ZIP_FILE..."
        unzip -o "$ZIP_FILE" -d extracted_project
        
        # پیدا کردن مسیر اصلی پروژه که پوشه app یا build.gradle دارد
        PROJECT_DIR=$(find extracted_project -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
        echo "Project Root: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        if [ -f "./gradlew" ]; me
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
