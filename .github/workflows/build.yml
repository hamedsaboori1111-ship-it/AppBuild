name: Advanced Android APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        echo "Extracting $ZIP_FILE..."
        unzip -o "$ZIP_FILE" -d extracted_project
        
        PROJECT_DIR=$(find extracted_project -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
        echo "Project Root: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Advanced SDK & Stacktrace
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
      run: |
        cd ${{ env.PROJECT_DIR }}
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --warning-mode all
        else
          gradle assembleDebug --stacktrace --warning-mode all
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
